<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="https://teacherchriser.github.io/images/me.gif" type="image/x-icon">
<title>Professor Christian Board Game</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patua+One&display=swap">
<style>
:root{--bg:#0b3d2e;--bg2:#05160f;--gold:#f5c542;--red:#c8102e;--ink:#1b1b1b;--paper:#fffdf5;--neon:#ff2e63;--ok:#12803c;color-scheme:dark}
*{box-sizing:border-box;font-family:'Patua One',Georgia,serif;font-weight:400}
body{margin:0;min-height:100vh;color:#fff;background:radial-gradient(ellipse at top,var(--bg) 0%,var(--bg2) 80%) fixed;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px))}
h1{text-align:center;margin:6px 0 0;font-size:clamp(1.6rem,6vw,3rem);color:var(--gold);text-shadow:0 0 6px var(--neon),0 0 18px var(--neon),0 0 30px #ff7a00;letter-spacing:1px}
.sub{text-align:center;margin:2px 0 10px;font-size:clamp(1rem,3.2vw,1.35rem);color:#ffe9a8;letter-spacing:1px}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;max-width:620px;margin:0 auto 8px;padding:8px;border:2px solid var(--gold);border-radius:14px;background:#0008}
button{background:linear-gradient(#f9dd7a,var(--gold));color:#3a2600;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;box-shadow:0 3px 0 #8a6a00;font-size:1rem}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #8a6a00}
button.red{background:linear-gradient(#ff5470,var(--red));color:#fff;box-shadow:0 3px 0 #6d0017}
#clock{font-size:1.8rem;min-width:64px;text-align:center;background:#000;border:2px solid var(--neon);border-radius:10px;padding:0 10px;text-shadow:0 0 8px var(--neon)}
#clock.low{color:#ff4d4d;animation:bl .5s infinite}
@keyframes bl{50%{opacity:.35}}
#prog{height:6px;max-width:620px;margin:0 auto 12px;background:#0006;border-radius:6px;overflow:hidden}
#prog i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),var(--neon));transition:width 1s linear}
.stage{max-width:620px;margin:0 auto}
.card{position:relative;background:var(--paper);color:var(--ink);border-radius:18px;border:6px solid var(--gold);box-shadow:0 10px 30px #000a,inset 0 0 0 3px var(--red);padding:20px 20px 18px;animation:deal .45s ease}
@keyframes deal{from{transform:translateX(60px) rotate(6deg);opacity:0}}
.corner{position:absolute;top:8px;left:14px;font-size:1rem}
.corner.r{left:auto;right:14px;transform:rotate(180deg)}
.badges{margin:12px 0 6px}
.badge{display:inline-block;background:var(--red);color:#fff;border-radius:999px;padding:2px 12px;font-size:.78rem;letter-spacing:1px;text-transform:uppercase;margin:0 4px 4px 0} <!-- display:inline-block -->
.badge.b2{display:inline-block;background:var(--ink);color:var(--gold)}
.q{font-size:clamp(1.5rem,5.6vw,2.1rem);line-height:1.3;margin:6px 0 12px}
.q u{display:inline-block;min-width:70px;border-bottom:3px solid var(--red);text-decoration:none}
.opts{list-style:none;padding:0;margin:0;display:grid;gap:3px;font-size:1.05rem}
.opts b{color:var(--red);margin-right:8px}
.opts li.ok{color:var(--ok)}
.opts li.ok::after{content:" ✔"}
.ans{display:none;margin-top:12px;padding:8px 12px;background:#d6f5df;border:2px solid var(--ok);border-radius:10px;color:#0d4a23;font-size:1.15rem}
.show .ans{display:block}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:5px;max-width:980px;margin:18px auto 0}
.nav button{padding:5px 0;font-size:.8rem;border-radius:8px;box-shadow:none;background:#0007;color:#fff;border:1px solid var(--gold)}
.nav button.f{color:#ff9aa8}
.nav button.cur{background:var(--gold);color:#3a2600}
@media(max-width:520px){button{padding:7px 12px;font-size:.9rem}}
</style>
</head>
<body>
<h1>♠ Professor Christian Board Game ♥</h1>
<div class="sub">Let’s play and check your knowledge</div>

<div class="bar">
  <span id="clock">30</span>
  <button id="go">▶ Start</button><button id="rst" class="red">↺ Reset</button>
  <button id="mute" title="Mute / unmute">🔊</button>
  <button id="shuf" title="Shuffle cards">🔀</button>
</div>
<div id="prog"><i></i></div>

<div class="stage">
  <div id="card"></div>
  <div class="row">
    <button id="prev">◀ Prev</button>
    <button id="see" class="red">See answer</button>
    <button id="next">Next ▶</button>
  </div>
</div>
<div class="nav" id="nav"></div>
<audio id="bgm" loop></audio>

<script>
/* ============ SETTINGS (edit here) ============ */
const TIME_SECONDS = 30;   // countdown time per card
const MUSIC_SRC = "https://nu.vgmtreasurechest.com/soundtracks/side-pocket-snes/gamhafbq/02%20The%20Lounge.mp3";      // background music, e.g. "music.mp3" (same folder as this file)

/* ============ QUESTIONS (edit here) ============
   Topics: index in TOPICS. Form: A = affirmative, N = negative, Q = question.
   Multiple choice: [topic, form, "question", ["a","b","c"], indexOfCorrectOption]
   Fill the gap:    [topic, form, "question with ___", "correct answer"]            */
const TOPICS=["Present Simple","Present Continuous","Present Simple vs Continuous","Past Simple","Past Continuous","Present Perfect","Future","Modal Verbs","Might & May","There is / are / was / were","Question Forms","Relative Clauses","Irregular Verbs","Comparatives & Superlatives"];
const FORM={A:"Affirmative",N:"Negative",Q:"Question"};

const MC=[
[0,"A","Water ___ at 100 degrees Celsius.",["boils","is boiling","boil"],0],
[0,"Q","How often ___ your parents visit you?",["do","does","are"],0],
[1,"N","Don’t call me now. We ___ dinner.",["aren’t having","don’t have","haven’t"],0],
[1,"Q","Who ___ to on the phone right now?",["are you talking","do you talk","did you talk"],0],
[2,"A","She usually drinks tea, but today she ___ coffee.",["drinks","is drinking","drink"],1],
[2,"N","Tom normally walks to work, but this week he ___ because of the rain.",["doesn’t walk","isn’t walking","not walks"],1],
[3,"A","I ___ my first English class ten years ago.",["had","have had","have"],0],
[3,"Q","Where ___ your last holiday?",["did you spend","you spent","do you spend"],0],
[3,"N","We ___ the film because the tickets were too expensive.",["didn’t watch","not watched","didn’t watched"],0],
[4,"N","They ___ football when it started to rain; they were already at home.",["weren’t playing","didn’t playing","wasn’t playing"],0],
[4,"Q","What ___ at eight o’clock last night?",["were you doing","did you doing","are you doing"],0],
[5,"A","I ___ three different jobs since 2020.",["had","have had","am having"],1],
[5,"N","My brother ___ his driving test yet.",["hasn’t passed","didn’t pass","hasn’t pass"],0],
[5,"Q","___ ever eaten sushi?",["Have you","Did you","Are you"],0],
[6,"A","Look at those black clouds! It ___ rain.",["will","is going to","is"],1],
[6,"Q","___ anything special this weekend?",["Do you do","Are you doing","Will you doing"],1],
[7,"A","Students ___ wear a uniform at my school; it’s the rule.",["have to","should","might"],0],
[7,"N","You ___ pay to enter the museum. It’s free.",["mustn’t","don’t have to","shouldn’t"],1],
[8,"A","Take an umbrella. It ___ rain later.",["might","must","has to"],0],
[8,"N","I ___ go to the party. I’m not sure yet.",["may not","mustn’t","don’t have to"],0],
[9,"N","There ___ any milk in the fridge, so I went to the shop.",["wasn’t","weren’t","aren’t"],0],
[9,"Q","___ any good restaurants near your house?",["Is there","Are there","Was there"],1],
[10,"Q","How long ___ in this city?",["have you lived","did you lived","do you lived"],0],
[10,"Q","A: ___ you help me with this exercise? B: Of course!",["Will","Have","Did"],0],
[11,"A","That’s the restaurant ___ we had dinner last week.",["which","where","who"],1],
[11,"N","She is a teacher ___ doesn’t give homework.",["who","which","where"],0],
[12,"A","Last week I ___ a new phone and I love it.",["buyed","bought","brought"],1],
[12,"N","We ___ the concert because we arrived late.",["didn’t see","didn’t saw","not saw"],0],
[13,"A","This is the ___ day of my life!",["better","best","most good"],1],
[13,"N","This book isn’t as ___ as the film.",["interesting","more interesting","most interesting"],0]
];

const FG=[
[0,"A","My cousin ___ (start) work at 6 a.m. every day.","starts"],
[0,"N","Maria ___ (not / like) spicy food.","doesn’t like"],
[1,"A","Look! The children ___ (play) in the garden.","are playing"],
[1,"Q","___ (you / listen) to me right now?","Are you listening"],
[2,"A","He usually ___ (drive) to work, but today he ___ (take) the bus.","drives / is taking"],
[2,"N","I ___ (not / understand) this lesson. Can you explain it again?","don’t understand"],
[3,"A","Last year we ___ (visit) Cartagena for the first time.","visited"],
[3,"Q","___ (you / see) Ana at the party last night?","Did you see"],
[4,"A","While I ___ (cook), my brother ___ (call) me.","was cooking / called"],
[4,"N","At 9 p.m. yesterday I ___ (not / study); I was watching a series.","wasn’t studying"],
[5,"A","She ___ (live) in Bogotá for five years.","has lived"],
[5,"Q","___ (they / finish) the project yet?","Have they finished"],
[6,"A","Don’t worry. I ___ (help) you with your homework.","will help"],
[6,"N","I’m sure it ___ (not / rain) tomorrow.","won’t rain"],
[7,"N","You ___ (must) park here; it’s forbidden.","mustn’t"],
[7,"Q","___ you have to work on Sundays?","Do"],
[7,"A","Children under twelve ___ be accompanied by an adult; it’s the rule.","must"],
[8,"A","Ask Mark. He ___ know the answer; he studied this topic. (not sure)","might / may"],
[8,"N","She ___ come to class tomorrow because she is ill. (not sure)","might not / may not"],
[9,"A","When I was a child, there ___ a big tree behind my house.","was"],
[9,"Q","___ many people at the gym yesterday?","Were there"],
[9,"N","There ___ enough chairs at the meeting, so we stood.","weren’t"],
[10,"Q","What time ___ (you / get up) yesterday?","did you get up"],
[10,"Q","How many languages ___ (your teacher / speak)?","does your teacher speak"],
[11,"A","A mechanic is a person ___ repairs cars. (who / which / where)","who"],
[11,"A","I lost the phone ___ my mother gave me. (who / which / where)","which"],
[12,"A","She ___ (write) a beautiful poem when she was ten.","wrote"],
[12,"N","I have never ___ (swim) in the sea.","swum"],
[13,"A","Cartagena is ___ (hot) than Bogotá.","hotter"],
[13,"Q","Which is ___ (long) river in South America?","the longest"]
];

/* ============ GAME ENGINE ============ */
const Q=[...MC.map(([p,f,q,o,a])=>({t:"m",p,f,q,o,a})),...FG.map(([p,f,q,a])=>({t:"f",p,f,q,o:[],a}))];
const ord=Q.map((_,i)=>i);let pos=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LET="abc";

function render(){
  const c=Q[ord[pos]],s=c.t==="m"?"♠":"♥";
  let h=`<div class="card" id="cd"><span class="corner">${s} ${pos+1}</span><span class="corner r">${s} ${pos+1}</span>
  <div class="badges"><span class="badge" style="display:none;">${TOPICS[c.p]}</span><span class="badge b2">${FORM[c.f]}</span></div>
  <div class="q">${esc(c.q).replace(/_{2,}/g,"<u>&nbsp;</u>")}</div>`;
  if(c.t==="m"){
    h+=`<ul class="opts">${c.o.map((o,j)=>`<li><b>${LET[j]})</b>${esc(o)}</li>`).join("")}</ul>`;
    h+=`<div class="ans">Answer: ${LET[c.a]}) ${esc(c.o[c.a])}</div>`;
  }else h+=`<div class="ans">Answer: ${esc(c.a)}</div>`;
  $("card").innerHTML=h+`</div>`;
  $("see").textContent="See answer";
  document.querySelectorAll("#nav button").forEach((b,i)=>b.classList.toggle("cur",i===pos));
  resetT();
}
function buildNav(){$("nav").innerHTML=ord.map((k,i)=>`<button class="${Q[k].t}" data-i="${i}">${i+1}</button>`).join("")}
const go=d=>{pos=(pos+d+Q.length)%Q.length;render()};
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
$("nav").onclick=e=>{const b=e.target.closest("button");if(b){pos=+b.dataset.i;render()}};
$("see").onclick=()=>{
  const cd=$("cd"),on=cd.classList.toggle("show"),c=Q[ord[pos]];
  $("see").textContent=on?"Hide answer":"See answer";
  cd.querySelectorAll(".opts li").forEach((li,j)=>li.classList.toggle("ok",on&&j===c.a));
  if(on)stopT();
};
$("shuf").onclick=()=>{
  for(let i=ord.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ord[i],ord[j]]=[ord[j],ord[i]]}
  pos=0;buildNav();render();
};

/* Timer */
let left=TIME_SECONDS,iv=null,muted=false,ac=null;
function beep(){
  if(muted)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    [0,.25,.5].forEach(d=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);
      g.gain.setValueAtTime(.2,ac.currentTime+d);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d+.2);o.start(ac.currentTime+d);o.stop(ac.currentTime+d+.2)})}catch(e){}
}
function draw(){
  $("clock").textContent=left;$("clock").classList.toggle("low",left<=5&&left>0);
  $("prog").firstElementChild.style.width=(left/TIME_SECONDS*100)+"%";
}
function stopT(){clearInterval(iv);iv=null;$("go").textContent="▶ Start"}
function resetT(){stopT();left=TIME_SECONDS;draw()}
$("rst").onclick=resetT;
$("go").onclick=()=>{
  if(iv){stopT();return}
  if(left<=0)resetT();
  $("go").textContent="⏸ Pause";
  iv=setInterval(()=>{left--;draw();if(left<=0){stopT();beep()}},1000);
};

/* Music (starts at the first click or tap, as browsers require) */
const bgm=$("bgm");
if(MUSIC_SRC){
  bgm.src=MUSIC_SRC;bgm.volume=.35;
  const start=()=>{if(!muted)bgm.play().catch(()=>{});document.removeEventListener("pointerdown",start)};
  document.addEventListener("pointerdown",start);
}
$("mute").onclick=()=>{
  muted=!muted;bgm.muted=muted;$("mute").textContent=muted?"🔇":"🔊";
  if(!muted&&MUSIC_SRC)bgm.play().catch(()=>{});
};

buildNav();render();
</script>
</body>
</html>
